services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tronpc
      POSTGRES_USER: tronpc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - tronpc_db:/var/lib/postgresql/data
  server:
    build: ../server
    restart: unless-stopped
    env_file: ../.env
    depends_on: [db]
    ports: ["8787:8787"]
volumes:
  tronpc_db:
