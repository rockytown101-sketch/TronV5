name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Run desktop checks
        run: npm run check

  build-windows:
    name: Windows x64
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Build NSIS installer and portable EXE
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tron-permission-control-v5.0.2-windows-x64
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 30

  build-macos-intel:
    name: macOS Intel x64
    needs: check
    runs-on: macos-15-intel
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Build macOS Intel DMG and ZIP
        run: npx electron-builder --mac dmg zip --x64 --publish never

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tron-permission-control-v5.0.2-macos-x64
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 30

  build-macos-arm64:
    name: macOS Apple Silicon arm64
    needs: check
    runs-on: macos-14
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Build macOS Apple Silicon DMG and ZIP
        run: npx electron-builder --mac dmg zip --arm64 --publish never

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tron-permission-control-v5.0.2-macos-arm64
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release assets
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-windows
      - build-macos-intel
      - build-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: tron-permission-control-v5.0.2-windows-x64
          path: release/windows

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: tron-permission-control-v5.0.2-macos-x64
          path: release/macos-x64

      - name: Download macOS Apple Silicon artifacts
        uses: actions/download-artifact@v4
        with:
          name: tron-permission-control-v5.0.2-macos-arm64
          path: release/macos-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/windows/*
            release/macos-x64/*
            release/macos-arm64/*
