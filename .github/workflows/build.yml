name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ============================================================
  # 1. 基础检查
  # ============================================================
  check:
    name: Static checks
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: desktop

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Run desktop checks
        run: npm run check


  # ============================================================
  # 2. Windows x64
  # ============================================================
  build-windows:
    name: Windows x64
    needs: check
    runs-on: windows-latest

    defaults:
      run:
        working-directory: desktop

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Build NSIS installer and portable EXE
        run: npm run dist:win

      - name: List generated files
        shell: pwsh
        run: Get-ChildItem -Path dist -Recurse

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tron-permission-control-v5.0.2-windows-x64
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # 3. macOS Intel x64
  # ============================================================
  build-macos-intel:
    name: macOS Intel x64
    needs: check
    runs-on: macos-15-intel

    defaults:
      run:
        working-directory: desktop

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Build macOS Intel DMG and ZIP
        run: npm run dist:mac:x64

      - name: List generated files
        run: ls -lah dist

      - name: Upload macOS Intel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tron-permission-control-v5.0.2-macos-x64
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # 4. macOS Apple Silicon ARM64
  # ============================================================
  build-macos-arm64:
    name: macOS Apple Silicon arm64
    needs: check
    runs-on: macos-15

    defaults:
      run:
        working-directory: desktop

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package.json

      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund

      - name: Build macOS Apple Silicon DMG and ZIP
        run: npm run dist:mac:arm64

      - name: List generated files
        run: ls -lah dist

      - name: Upload macOS ARM64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tron-permission-control-v5.0.2-macos-arm64
          path: desktop/dist/*
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # 5. GitHub Release
  #    只有使用 v* Tag 时才执行
  # ============================================================
  release:
    name: Publish GitHub Release assets

    if: startsWith(github.ref, 'refs/tags/')

    needs:
      - build-windows
      - build-macos-intel
      - build-macos-arm64

    runs-on: ubuntu-latest

    steps:

      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: tron-permission-control-v5.0.2-windows-x64
          path: release/windows

      - name: Download macOS Intel artifacts
        uses: actions/download-artifact@v4
        with:
          name: tron-permission-control-v5.0.2-macos-x64
          path: release/macos-x64

      - name: Download macOS Apple Silicon artifacts
        uses: actions/download-artifact@v4
        with:
          name: tron-permission-control-v5.0.2-macos-arm64
          path: release/macos-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release/windows/*
            release/macos-x64/*
            release/macos-arm64/*
